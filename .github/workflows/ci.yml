name: CI Verification (Rust/Wasm + Astro + GDPR & Audit Tests)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust toolchain (wasm32-unknown-unknown)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run Rust verifier unit tests
        working-directory: rust-verifier
        run: cargo test

      - name: Build Rust Wasm verifier
        working-directory: rust-verifier
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Install Node dependencies
        run: npm ci

      - name: Build Sass, Astro & docs output
        run: npm run build

      - name: Run full Node test suite (GDPR, EISS, Wasm, Stage 3)
        run: node --test tests/*.test.mjs
